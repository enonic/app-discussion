kind: "Part"
title: "Latest comments"
form:
  - type: "FieldSet"
    label: "Latest comments"
    items:
      - type: "TextLine"
        name: "headline"
        label: "Title"
        helpText: "The headline text displayed on this part"
        default: ""
        occurrences:
          min: 0
          max: 1
      - type: "Long"
        name: "size"
        label: "How many comments to show?"
        default: 5
        min: 1
        max: 20
        occurrences:
          min: 0
          max: 1
